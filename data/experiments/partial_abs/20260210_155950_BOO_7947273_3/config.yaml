abstractions:
  lemma_abstraction:
    max_arity: 5
    stitch_iterations: 20
    topk: 50
  use_domain_abstractions: false
  use_partial_proof_lemmas: true
hints_twee:
  flags:
  - --all-lemmas
  - --show-peaks
  - --hint-skel-factor 0
  - --hint-skel-cost 0
  - --flatten-goal
timeslice: 50
twee:
  flags:
  - --all-lemmas
  - --show-peaks
  - --proof-on-saturation
  - --max-time 50
  - --flatten-goal
  timeout: 1000
